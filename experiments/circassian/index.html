<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Черкешенка у реки</title>
<link href="https://fonts.googleapis.com/css2?family=Neucha&family=PT+Sans:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#d9d2c3;display:flex;align-items:center;justify-content:center}
svg{height:96vh;aspect-ratio:9/16;background:#F3EBDA;box-shadow:0 8px 30px #0003}
.ink{fill:none;stroke:#2A2622;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:3}
.cap{font-family:'Neucha';font-size:62px;fill:#2A2622;text-anchor:middle}
.ttl{font-family:'PT Sans';font-weight:700;font-size:58px;fill:#8E2B22;text-anchor:middle;letter-spacing:4px}
</style></head><body>
<svg id="s" viewBox="0 0 1080 1920">
<defs>
 <filter id="pencil"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1"/>
  <feDisplacementMap in="SourceGraphic" scale="5"/></filter>
 <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
  <line x1="0" y1="0" x2="0" y2="14" stroke="#2A2622" stroke-width="2" opacity=".35"/></pattern>
 <pattern id="red" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
  <line x1="0" y1="0" x2="0" y2="12" stroke="#8E2B22" stroke-width="4" opacity=".7"/></pattern>
</defs>
<g filter="url(#pencil)">
 <text id="title" class="ttl" x="540" y="190">ДОЧЬ ГОР</text>
 <!-- sun -->
 <g id="sun"><circle class="ink draw" cx="250" cy="330" r="70"/>
  <g id="rays" class="ink thin"></g></g>
 <!-- mountains -->
 <path class="ink draw" d="M-20 900 L170 560 L260 680 L420 420 L560 640 L650 540 L840 330 L1100 800"/>
 <path class="ink thin draw" d="M370 500 L420 420 L470 500 L445 480 L420 510 L395 480 Z M790 410 L840 330 L895 420 L865 400 L840 430 L815 400 Z"/>
 <path d="M420 420 L560 640 L470 900 L330 900 Z M840 330 L1100 800 L960 900 L760 900 Z" fill="url(#hatch)"/>
 <path class="ink thin draw" d="M-20 1000 C200 900 300 960 480 920 S800 880 1100 960"/>
 <!-- trees -->
 <g class="ink thin draw" id="trees"></g>
 <!-- river -->
 <path class="ink draw" d="M-20 1160 C250 1110 500 1200 1100 1130"/>
 <path class="ink draw" d="M-20 1330 C300 1290 600 1380 1100 1300"/>
 <g id="waves" class="ink thin"></g>
 <!-- stones -->
 <path class="ink thin draw" d="M640 1345 q30 -40 70 0 Z M720 1350 q20 -25 45 0 Z M120 1305 q35 -45 80 0 Z"/>
 <!-- ground -->
 <path class="ink thin draw" d="M-20 1500 C300 1470 700 1520 1100 1480"/>
 <g id="grass" class="ink thin"></g>
 <!-- birds -->
 <g id="birds" class="ink thin"></g>
 <!-- woman -->
 <g id="woman" class="ink">
  <!-- dress -->
  <path d="M-10 -250 L-75 0 L75 0 L10 -250 Z" fill="#F3EBDA"/>
  <path d="M-75 0 L75 0" />
  <path d="M0 -245 L0 -10" class="thin"/>
  <path d="M-30 -200 L-10 -170 M30 -200 L10 -170 M-34 -185 L-12 -155 M34 -185 L12 -155" class="thin" stroke="#8E2B22"/>
  <path d="M-38 -150 L38 -150" stroke="#8E2B22" stroke-width="7"/>
  <!-- legs peeking -->
  <path id="lf" d="M-15 0 l-8 18 M15 0 l8 18" class="thin"/>
  <!-- head + hat -->
  <circle cx="0" cy="-285" r="32" fill="#F3EBDA"/>
  <path d="M-26 -308 L-22 -350 L22 -350 L26 -308 Z" fill="url(#red)"/>
  <path d="M0 -350 l0 -16" class="thin"/>
  <path id="veil" d="M-26 -320 C-70 -260 -60 -170 -55 -120" class="thin"/>
  <path d="M-10 -282 q4 4 0 0 M10 -282 q4 4 0 0 M-8 -268 q8 6 16 0" class="thin"/>
  <!-- braid -->
  <path d="M24 -275 c18 30 -6 60 12 100" class="thin"/>
  <!-- arm + jar -->
  <g id="arm"><path d="M8 -230 L50 -180 L60 -120" class="thin"/>
   <g id="jar" transform="translate(70,-110)">
    <path d="M-14 -40 q-6 -10 0 -16 h28 q6 6 0 16 q34 20 22 60 q-10 30 -36 30 q-26 0 -36 -30 q-12 -40 22 -60Z" fill="#F3EBDA"/>
    <path d="M-28 0 h56 M-30 12 h60" class="thin" stroke="#8E2B22"/>
    <path d="M18 -36 q26 6 20 34" class="thin"/>
   </g></g>
 </g>
 <g id="drops" class="ink thin"></g>
 <!-- caption -->
 <text id="cap" class="cap" x="540" y="1680"></text>
 <text id="cap2" class="cap" x="540" y="1760"></text>
</g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const mk=(p,tag,a)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
for(let i=0;i<10;i++){const a=i*Math.PI/5;mk($('rays'),'path',{d:`M${250+95*Math.cos(a)} ${330+95*Math.sin(a)} L${250+125*Math.cos(a)} ${330+125*Math.sin(a)}`})}
[[90,980],[160,960],[930,990],[1000,975],[860,1000]].forEach(([x,y])=>mk($('trees'),'path',{d:`M${x} ${y} l-28 0 l28 -90 l28 90 z M${x} ${y} l0 22`}));
const waves=[...Array(9)].map((_,i)=>mk($('waves'),'path',{d:'M0 0 q20 -12 40 0 q20 12 40 0'}));
const grass=[...Array(14)].map((_,i)=>mk($('grass'),'path',{d:`M${40+i*75} 1500 q-6 -30 -14 -40 M${40+i*75} 1500 q4 -34 10 -46`}));
const birds=[...Array(5)].map(()=>mk($('birds'),'path',{}));
const drops=[...Array(6)].map(()=>mk($('drops'),'circle',{r:5}));
// draw-on
const draws=[...document.querySelectorAll('path.draw,circle.draw')].map((e,i)=>{const L=e.getTotalLength();e.style.strokeDasharray=L;return{e,L,start:0.2+i*0.18}});
const caps=[
 [0,5,'Рассвет в горах Черкесии.',''],
 [5,10,'Она идёт к реке, как шли','её мать и бабушка.'],
 [10,15,'Встретив женщину, всадник','спешивался — из уважения.'],
 [15,20,'Платок, брошенный ею,','мог остановить драку мужчин.'],
 [20,25,'Она держала дом, хранила','обычай и говорила своё слово.'],
 [25,30,'Сила — в спокойствии.','Свобода — в её выборе.']];
const D=30, t0=performance.now();let lastSeed=-1;
function womanAt(t){ // x, walking?, phase
 if(t<4)return{x:-120+ (t/4)*0,walk:false,dip:0,full:false};
 if(t<11)return{x:-120+(t-4)/7*560,walk:true,dip:0,full:false};
 if(t<15){const p=(t-11)/4;return{x:440,walk:false,dip:Math.sin(Math.min(p,1)*Math.PI),full:p>.5}}
 if(t<19)return{x:440,walk:false,dip:0,full:true};
 return{x:440+(t-19)/11*720,walk:true,dip:0,full:true};
}
function frame(now){
 const t=((now-t0)/1000)%D, f=Math.floor(t*30);
 if(Math.floor(f/3)!==lastSeed){lastSeed=Math.floor(f/3);$('turb').setAttribute('seed',lastSeed%7+1)}
 draws.forEach(d=>{const p=Math.min(1,Math.max(0,(t-d.start)/0.6));d.e.style.strokeDashoffset=d.L*(1-p)});
 $('title').style.opacity=Math.min(1,t/1.2);
 $('rays').setAttribute('transform',`rotate(${t*6} 250 330)`);
 waves.forEach((w,i)=>{const row=i%3,x=((i*137+t*(60+row*15))%1240)-120,y=1190+row*45+Math.sin(x/90)*6;w.setAttribute('transform',`translate(${x} ${y})`)});
 grass.forEach((g,i)=>g.setAttribute("transform",`rotate(${Math.sin(t*2+i)*6} ${40+i*75} 1500)`));
 birds.forEach((b,i)=>{const x=((t*(50+i*8)+i*220)%1400)-160,y=520+i*45+Math.sin(t+i)*20,w=Math.sin(t*8+i*1.3)*18;
  b.setAttribute('d',`M${x-30} ${y-w} Q${x-14} ${y-10} ${x} ${y} Q${x+14} ${y-10} ${x+30} ${y-w}`)});
 const s=womanAt(t),bob=s.walk?Math.abs(Math.sin(t*6))*-8:0;
 $('woman').setAttribute('transform',`translate(${s.x} ${1500+bob}) scale(.95)`);
 $('lf').setAttribute('d',s.walk?`M-15 0 l${-8+Math.sin(t*6)*10} 18 M15 0 l${8-Math.sin(t*6)*10} 18`:'M-15 0 l-8 18 M15 0 l8 18');
 $('veil').setAttribute('d',`M-26 -320 C${-70+Math.sin(t*2)*10} -260 ${-60+Math.sin(t*2.5)*12} -170 ${-55+Math.sin(t*3)*14} -120`);
 $('arm').setAttribute('transform',`rotate(${s.dip*55} 8 -230)`);
 drops.forEach((d,i)=>{const on=s.full&&t>13&&t<16.5,p=((t*1.6+i/6)%1);d.setAttribute('cx',s.x+90+i*4);d.setAttribute('cy',1430+p*80);d.style.opacity=on?1-p:0});
 const c=caps.find(c=>t>=c[0]&&t<c[1]),a=Math.min(1,(t-c[0])/0.5,(c[1]-t)/0.4);
 $('cap').textContent=c[2];$('cap2').textContent=c[3];$('cap').style.opacity=$('cap2').style.opacity=a;
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
