name: learn

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      learn:
        description: "Run the proposal step now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reels-state
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Metrics every day (24/72/168 h windows must be caught on time)
        run: npm run -s metrics -- --lang ru
      - name: Is this a 5th day?
        id: cycle
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          if [ $(( day % 5 )) -eq 0 ] || [ "${{ inputs.learn }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Proposals to Telegram
        if: steps.cycle.outputs.run == 'true'
        run: npm run -s learn -- --lang ru
      - name: Commit state
        run: |
          git config user.name "facts-factory bot"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "state: metrics and proposals" && git pull --rebase origin main && git push origin HEAD:main)
      - name: Alert on failure
        if: failure()
        run: |
          npm run -s alert -- --lang ru "learn workflow failed ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
